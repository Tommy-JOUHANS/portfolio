name: Backend CI

on:
  push:
    paths:
      - "cyberaudit/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "cyberaudit/backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyberaudit/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 libpango-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b libfontconfig1 fonts-liberation

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check apps/ config/ core/

      - name: Format check (black)
        run: black --check apps/ config/ core/

      - name: Tests with coverage
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=80
